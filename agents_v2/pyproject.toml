[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sw_agents"
version = "2.0.0"
description = "SentinelWard agent layer A1-A8 (fresh build, 17 Oct 2026, team TessNova)"
requires-python = ">=3.12"
dependencies = ["sw_common>=1.1", "paho-mqtt>=2.1,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sw-agents2 = "sw_agents.service:main"

[tool.setuptools]
packages = ["sw_agents", "sw_agents.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# macOS may flag editable-install .pth files hidden (see brain/README.md); these paths make tests independent of that.
pythonpath = [".", "../common", "../security_v2"]
markers = ["live: needs a real Mosquitto; runs only when SW_AGENTS_LIVE_MOSQUITTO is set"]
