# SentinelWard hub config. Installed as /etc/mosquitto/conf.d/sentinelward.conf
# Ubuntu's /etc/mosquitto/mosquitto.conf already sets persistence_location and pid_file.

# One listener, server-local only. No firewall port is opened.
listener 1883 127.0.0.1

# TEMPORARY: anonymous allowed on localhost until Kartik switches on Dynamic Security.
allow_anonymous true

# Retained `verdict` messages must survive a broker restart.
persistence true
autosave_interval 30

# doc 17 flood test: default 1,000 queued messages per client is too low.
max_queued_messages 10000

# Logging: Ubuntu's mosquitto.conf already has `log_dest file /var/log/mosquitto/mosquitto.log`
# and Mosquitto allows only one `log_dest file`. ~/sw/deploy/logs/mosquitto.log is a symlink to it.
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---- Kartik owns hub security (Dynamic Security + TLS). Kept OFF until he initialises it. ----
# Path corrected for Ubuntu s390x (his example used the RHEL path /usr/lib64/...).
# When enabling: set allow_anonymous false and uncomment both lines.
#plugin /usr/lib/s390x-linux-gnu/mosquitto_dynamic_security.so
#plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json
