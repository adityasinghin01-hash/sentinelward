# SentinelWard as containers on IBM LinuxONE (s390x).
# A second, isolated copy of the ward: its own hub, database and network; only the web app is
# published, on 127.0.0.1:8001 (the bare-metal systemd stack keeps 8000). Run ./make-env.sh first.
name: sentinelward

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp"]
  restart: unless-stopped
  networks: [ward]

x-mqtt-env: &mqtt-env
  SW_MQTT_HOST: hub
  MQTT_HOST: hub
  SW_MQTT_PORT: "1883"
  MQTT_PORT: "1883"

x-app: &app
  <<: *hardening
  image: sentinelward:latest
  env_file: [.env.containers]
  environment:
    <<: *mqtt-env
  depends_on:
    hub: {condition: service_healthy}

services:
  hub:
    image: eclipse-mosquitto:2.0.22  # 2.0.18 has no s390x build
    # Startup/health probes need root to read 0600 mounts; broker drops to mosquitto.
    user: "0:0"
    # Bypass image entrypoint's recursive chown of /mosquitto (includes host mounts).
    entrypoint: ["/bin/sh", "/etc/hub-start.sh"]
    environment:
      XDG_CONFIG_HOME: /run/mqtt-clients/brain
    secrets: [mqtt_passwords]
    tmpfs: ["/run/mosquitto:mode=0755"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto.acl:/mosquitto/config/acl:ro
      - ./hub-start.sh:/etc/hub-start.sh:ro
      # Root-only CLI configs for health/auth probes; the broker reads only hashes.
      - ./.mqtt/clients:/run/mqtt-clients:ro
      - hubdata:/mosquitto/data
    networks: [ward]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    # Authenticated subscribe acknowledgement; does not depend on retained app data.
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-p", "1883", "-V", "mqttv5", "-t", "ward/demo/control", "-E", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinelward
      POSTGRES_USER: sw_api
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [dbdata:/var/lib/postgresql/data]
    networks: [ward]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sw_api -d sentinelward"]
      interval: 5s
      retries: 20

  api:
    <<: *app
    env_file: [.env.containers, .mqtt/api.env]
    build: {context: ../.., dockerfile: deploy/containers/Dockerfile}
    command: ["python", "-m", "sw_api"]
    environment:
      <<: *mqtt-env
      SW_API_HOST: 0.0.0.0
      SW_API_PORT: "8000"
      SW_FRONTEND_DIST: /srv/web/dist
    volumes:
      # world-readable copy made by ./sync-frontend.sh (the api runs as uid 10001, not the file owner)
      - ${SW_FRONTEND_DIR:-./web-dist}:/srv/web/dist:ro
    # ward is internal (no route out); edge exists only so Docker can publish the API port.
    networks: [ward, edge]
    ports: ["127.0.0.1:8001:8000"]
    depends_on:
      hub: {condition: service_healthy}
      db: {condition: service_healthy}
    # Healthy only when /api/health answers ok=true (it also reports MQTT and database state).
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4); sys.exit(0 if json.load(r).get('ok') is True else 1)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    mem_limit: 384m
    cpus: 1.0

  # brain, sim and attacks serve no port, so they have no healthcheck: `docker compose ps` shows
  # them as plain "Up" (with restart counts) rather than a health state that would prove nothing.
  brain:
    <<: *app
    env_file: [.mqtt/brain.env]
    command: ["python", "-m", "sw_brain"]
    environment:
      <<: *mqtt-env
      # Highest accepted bed number (B01..B<n>, MON-01..MON-<n>); 12 = the ward. Scale tests raise it.
      SW_BRAIN_MAX_BED: ${SW_BRAIN_MAX_BED:-12}
      SW_BRAIN_TICK_STATS: ${SW_BRAIN_TICK_STATS:-0}
    # Per-bed history is bounded (300 s look-back); 768m kept from the earlier measured peaks.
    mem_limit: 768m
    cpus: 1.0

  sim:
    <<: *app
    env_file: [.mqtt/sim.env]
    command: ["python", "-m", "sw_sim", "listen", "--packs", "/packs", "--runs", "/runs/simulator",
              "--script", "/app/simulator/ward_script.yaml"]
    volumes:
      - ${SW_PACKS_DIR:-/home/linux1/sw/packs}:/packs:ro
      - runs:/runs
    mem_limit: 256m
    cpus: 0.5

  attacks:
    <<: *app
    env_file: [.mqtt/attacks.env]
    command: ["python", "-m", "sw_attacks", "--runs-dir", "/runs/attacks",
              "--schedule", "/app/attacks/schedule.yaml"]
    volumes: [runs:/runs]
    # 128m was OOM-killed 13 min into a run (1200-s vitals history per bed); bare metal: 238 MB RSS.
    mem_limit: 384m
    cpus: 0.25

networks:
  ward: {internal: true}
  edge: {}

volumes:
  hubdata: {}
  dbdata: {}
  runs: {}

secrets:
  db_password: {file: ./db_password.txt}
  mqtt_passwords: {file: ./.mqtt/passwords}
