# SentinelWard ward script (doc 12): the 12 beds the ward simulator replays.
#
# Fields marked "H1 PICK", "H1 WINDOW" or "H1 CONFIRM" are decided at H1:
#   H1 CONFIRM  run `python -m sw_data check <record>` first; if it fails, put the backup in.
#   H1 PICK     fill in from `python -m sw_data pick-mimic <mimic root> --exclude p000052,p000107,p000109 --need 3`.
#   H1 WINDOW   fill in the "suggested start" minute printed by `python -m sw_data check <case>.vital`.
# A bed whose H1 field is still null fails the build loudly; the other beds still build.
#
# Relative paths below are relative to this file. Point them at your local copies.
# Machines: 2015 + MIMIC beds build on LinuxONE or Mac; VitalDB beds (B08-B10) on Mac or Colab only:
#   python -m sw_data build beds.yaml --out packs --beds B01,B02,B03,B04,B05,B06,B07,B11,B12   # LinuxONE
#   python -m sw_data build beds.yaml --out packs --beds B08,B09,B10                           # Mac

version: 1

paths:
  cinc2015: ../sources/challenge-2015/training          # folder holding a123l.hea / a123l.dat ...
  mimic: ../sources/mimic3wdb-matched-sample            # sample root: p00/p000052/...
  vitaldb: ../sources/vitaldb                           # folder holding <case>.vital
  vitaldb_clinical: ../sources/vitaldb/clinical_data.csv

# signals = required signals; a bed fails if one is absent or more than 50 % missing in its window.
#   ecg, ppg, abp, resp : waveforms (resp = the RESP waveform, stored as an extra 125 Hz "resp" array)
#   numerics            : MIMIC numerics record lined up with the piece, HR at most 50 % missing
#   numbers             : VitalDB Solar8000 numbers, HR at most 50 % missing
#   cuff                : VitalDB NIBP track with at least one new reading in the window

beds:
  - bed_id: B01
    device_id: MON-01
    dataset: mimic
    patient: p000109
    piece: "3407610_0006"    # doc 12 named 3346682_0014, but only p000109's piece 3407610_0006..0020 is on the
                             # server (deploy/SETUP.md). Same patient, same signals (II, V, AVR, PLETH, RESP).
    start_s: 7200            # 2 h into the piece
    duration_s: 1320         # 22 min
    signals: [ecg, ppg, resp, numerics]

  - bed_id: B02
    device_id: MON-02
    dataset: mimic
    patient: p000052
    piece: "3533390_0011"
    start_s: 0
    duration_s: 1320
    signals: [ecg, ppg, resp, numerics]

  - bed_id: B03
    device_id: MON-03
    dataset: cinc2015
    record: v221l            # true VT; whole record
    signals: [ecg, ppg, abp]

  - bed_id: B04
    device_id: MON-04
    dataset: cinc2015
    record: a123l            # H1 CONFIRMED 17 Oct: false ASYSTOLE, II/PLETH/ABP 0 % missing, ECG flat before alarm
    backup_record: null      # not needed (none named in doc 12)
    signals: [ecg, ppg, abp]

  - bed_id: B05
    device_id: MON-05
    dataset: mimic
    patient: p000107
    piece: "3860035_0044"
    start_s: 0
    duration_s: 1320
    signals: [ecg, ppg, numerics]

  - bed_id: B06
    device_id: MON-06
    dataset: mimic
    patient: p000154           # H1 PICK 17 Oct: pick-mimic row 1
    piece: "3783784_0006"
    start_s: 0               # pick-mimic suggested start
    duration_s: 1320
    signals: [ecg, ppg, numerics]

  - bed_id: B07
    device_id: MON-07
    dataset: cinc2015
    record: f543l            # H1 CONFIRMED 17 Oct: true VFIB, II/PLETH/ABP 0 % missing
    backup_record: null      # not needed (none named in doc 12)
    signals: [ecg, ppg, abp]

  - bed_id: B08
    device_id: MON-08
    dataset: vitaldb
    case: 5552
    window_ref: file         # minutes counted from the start of the .vital file (casestart = 0)
    start_min: 231           # surgery minutes 231-253
    duration_s: 1320
    signals: [ecg, ppg, abp, cuff, numbers]

  - bed_id: B09
    device_id: MON-09
    dataset: vitaldb
    case: 912
    window_ref: file
    start_min: 38            # surgery minutes 38-60
    duration_s: 1320
    signals: [ecg, ppg, abp, cuff, numbers]

  - bed_id: B10
    device_id: MON-10
    dataset: vitaldb
    case: 4277               # H1 CONFIRMED 17 Oct: aline1 'Left radial', all tracks found; backup not needed
    backup_case: 5659
    window_ref: file
    start_min: 12            # H1 WINDOW 17 Oct: `check 4277.vital` suggests minute 12 (ART reads -12 mmHg, line not
                             # connected, in file minutes 0-9; flushed in minute 11). Cuffs at window min 0,1,2,4,5 only.
    duration_s: 1320
    signals: [ecg, ppg, abp, cuff, numbers]

  - bed_id: B11
    device_id: MON-11
    dataset: mimic
    patient: p000160           # H1 PICK 17 Oct: pick-mimic row 2
    piece: "3531764_0003"
    start_s: 0               # pick-mimic suggested start
    duration_s: 1320
    signals: [ecg, ppg, numerics]

  - bed_id: B12
    device_id: MON-12
    dataset: mimic
    patient: p000298           # H1 PICK 17 Oct: pick-mimic row 3
    piece: "3129212_0016"
    start_s: 0               # pick-mimic suggested start
    duration_s: 1320
    signals: [ecg, ppg, numerics]
