[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelward-brain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sw_common>=1.1.0", "numpy>=1.26", "scipy>=1.11", "paho-mqtt>=2.1,<3"]

[project.scripts]
sw-brain = "sw_brain.__main__:main"

[tool.setuptools.packages.find]
include = ["sw_brain*"]
