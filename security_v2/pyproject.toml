[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sw_sec"
version = "2.0.0"
description = "Fresh SentinelWard hub security implementation, 17 October 2026"
requires-python = ">=3.12"
dependencies = ["paho-mqtt>=2.1,<3", "sw_common>=1.1"]

[tool.setuptools]
packages = ["sw_sec"]
